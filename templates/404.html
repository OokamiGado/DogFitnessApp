<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Nie znaleziono | Dog Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #D4AF37;
            --navy: #1B1B2F;
            --light-bg: #F7F7F5;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-bg);
            color: var(--navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-wrapper {
            text-align: center;
            padding: 3rem;
        }
        .error-code {
            font-size: 7rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }
        .error-icon {
            font-size: 3rem;
            color: var(--navy);
            margin-bottom: 1rem;
        }
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: var(--navy);
            border-radius: 25px;
            padding: 0.6rem 2rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #B8962E;
            border-color: #B8962E;
            color: var(--navy);
        }
    </style>
</head>
<body>
    <div class="error-wrapper">
        <div class="error-icon"><i class="bi bi-compass"></i></div>
        <div class="error-code">404</div>
        <h2 class="mt-3 mb-2">Strona nie zostala znaleziona</h2>
        <p class="text-muted mb-4">Sprawdz, czy adres jest poprawny, albo wroc do strony glownej.</p>
        <a href="/" class="btn btn-primary"><i class="bi bi-house-door"></i> Wroc do strony glownej</a>
    </div>
</body>
</html>
