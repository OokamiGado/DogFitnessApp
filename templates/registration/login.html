{% extends 'base.html' %}
{% block title %}Logowanie{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="form-card" style="max-width: 420px; width: 100%; margin-top: 3rem;">
        <h1 class="mb-4 text-center"><i class="bi bi-activity"></i> Dog Fitness</h1>

        {% if form.errors %}
            <div class="alert alert-danger">Nieprawidlowa nazwa uzytkownika lub haslo.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nazwa uzytkownika</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Haslo</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100 mt-2">
                <i class="bi bi-box-arrow-in-right"></i> Zaloguj sie
            </button>
        </form>
    </div>
</div>
{% endblock %}
