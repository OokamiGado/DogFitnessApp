{% extends 'base.html' %}
{% block title %}Usuń grupę mięśniową{% endblock %}

{% block content %}
<h1>Usuń grupę mięśniową</h1>
<p>Czy na pewno chcesz usunąć grupę <strong>{{ muscle_group.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Tak, usuń</button>
    <a href="{% url 'muscle_group_list' %}" class="btn btn-secondary">Anuluj</a>
</form>
{% endblock %}
