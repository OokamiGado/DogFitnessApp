{% extends 'base.html' %}
{% block title %}Usuń ćwiczenie{% endblock %}

{% block content %}
<h1>Usuń ćwiczenie</h1>
<p>Czy na pewno chcesz usunąć ćwiczenie <strong>{{ exercise.name }}</strong>? Ta operacja jest nieodwracalna (usunie też wszystkie zdjęcia).</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Tak, usuń</button>
    <a href="{% url 'exercise_list' %}" class="btn btn-secondary">Anuluj</a>
</form>
{% endblock %}
