{% extends 'base.html' %}
{% block title %}Usuń ćwiczenie{% endblock %}

{% block content %}
<div class="form-card">
    <h1 class="mb-4"><i class="bi bi-exclamation-triangle text-danger"></i> Usuń ćwiczenie</h1>
    <p>Czy na pewno chcesz usunąć ćwiczenie <strong>{{ exercise.name }}</strong>? Ta operacja jest nieodwracalna (usunie też wszystkie zdjęcia).</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Tak, usuń</button>
        <a href="{% url 'exercise_list' %}" class="btn btn-secondary">Anuluj</a>
    </form>
</div>
{% endblock %}
