{% extends 'base.html' %}
{% block title %}Usuń sprzęt{% endblock %}

{% block content %}
<h1>Usuń sprzęt</h1>
<p>Czy na pewno chcesz usunąć sprzęt <strong>{{ equipment.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Tak, usuń</button>
    <a href="{% url 'equipment_list' %}" class="btn btn-secondary">Anuluj</a>
</form>
{% endblock %}
