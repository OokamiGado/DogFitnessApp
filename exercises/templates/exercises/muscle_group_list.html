{% extends 'base.html' %}
{% block title %}Grupy mięśniowe{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Grupy mięśniowe</h1>
    <a href="{% url 'muscle_group_create' %}" class="btn btn-primary">+ Dodaj grupę</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Nazwa</th>
            <th>Akcje</th>
        </tr>
    </thead>
    <tbody>
        {% for group in muscle_groups %}
        <tr>
            <td>{{ group.name }}</td>
            <td>
                <a href="{% url 'muscle_group_update' group.pk %}" class="btn btn-sm btn-outline-secondary">Edytuj</a>
                <a href="{% url 'muscle_group_delete' group.pk %}" class="btn btn-sm btn-outline-danger">Usuń</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2" class="text-center text-muted">Brak grup mięśniowych. Dodaj pierwszą!</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
