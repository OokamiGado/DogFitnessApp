{% extends 'base.html' %}
{% block title %}Sprzęt{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Sprzęt</h1>
    <a href="{% url 'equipment_create' %}" class="btn btn-primary">+ Dodaj sprzęt</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Nazwa</th>
            <th>Akcje</th>
        </tr>
    </thead>
    <tbody>
        {% for item in equipment %}
        <tr>
            <td>{{ item.name }}</td>
            <td>
                <a href="{% url 'equipment_update' item.pk %}" class="btn btn-sm btn-outline-secondary">Edytuj</a>
                <a href="{% url 'equipment_delete' item.pk %}" class="btn btn-sm btn-outline-danger">Usuń</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2" class="text-center text-muted">Brak sprzętu. Dodaj pierwszy!</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
