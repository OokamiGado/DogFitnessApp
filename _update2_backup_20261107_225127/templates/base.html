<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dog Fitness{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'exercise_list' %}">
                <i class="bi bi-activity"></i> Dog Fitness
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-lg-center">
                    {% if user.is_authenticated %}
                        <a class="nav-link" href="{% url 'exercise_list' %}"><i class="bi bi-list-ul"></i> Cwiczenia</a>
                        <a class="nav-link" href="{% url 'muscle_group_list' %}"><i class="bi bi-diagram-3"></i> Grupy miesniowe</a>
                        <a class="nav-link" href="{% url 'equipment_list' %}"><i class="bi bi-tools"></i> Sprzet</a>
                        <span class="navbar-text-custom mx-3"><i class="bi bi-person-circle"></i> {{ user.username }}</span>
                        <a class="nav-link" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right"></i> Wyloguj</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'success' }} d-flex align-items-center" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.exercise-card').forEach(function (card) {
                const tabs = card.querySelectorAll('.variant-tab');
                tabs.forEach(function (tab) {
                    tab.addEventListener('click', function () {
                        tabs.forEach(function (t) { t.classList.remove('active'); });
                        tab.classList.add('active');

                        card.querySelectorAll('.variant-content').forEach(function (c) {
                            c.style.display = 'none';
                        });
                        const target = card.querySelector('#' + tab.dataset.target);
                        if (target) target.style.display = 'block';

                        const detailBtn = card.querySelector('.detail-link-btn');
                        if (detailBtn && tab.dataset.detailUrl) {
                            detailBtn.href = tab.dataset.detailUrl;
                        }
                    });
                });
            });

            document.querySelectorAll('.image-delete-form').forEach(function (form) {
                form.addEventListener('submit', function (e) {
                    if (!confirm('Czy na pewno chcesz usunac to zdjecie?')) {
                        e.preventDefault();
                    }
                });
            });
        });
    </script>
</body>
</html>
